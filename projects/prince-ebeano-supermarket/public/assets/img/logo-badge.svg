    <use href="#pe-ray" transform="rotate(135 120 90)"/><use href="#pe-ray" transform="rotate(150 120 90)"/>
    <use href="#pe-ray" transform="rotate(165 120 90)"/><use href="#pe-ray" transform="rotate(180 120 90)"/>
