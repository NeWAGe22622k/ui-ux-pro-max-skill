    <clipPath id="pe-clip"><circle cx="120" cy="120" r="120"/></clipPath>
  </defs>
  <circle cx="120" cy="120" r="120" fill="url(#pe-bg)"/>
  <g clip-path="url(#pe-clip)" fill="#fff" fill-opacity=".05">
