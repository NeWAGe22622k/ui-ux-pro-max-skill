    <use href="#pe-ray" transform="rotate(225 120 90)"/><use href="#pe-ray" transform="rotate(240 120 90)"/>
    <use href="#pe-ray" transform="rotate(255 120 90)"/><use href="#pe-ray" transform="rotate(270 120 90)"/>
